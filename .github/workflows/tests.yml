name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        # core engine is stdlib-only; Pillow covers the --mp4 tests.
        run: pip install pytest Pillow
      - name: Run the suite
        run: python -m pytest -q
